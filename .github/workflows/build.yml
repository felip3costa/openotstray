name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenOTSTray/OpenOTSTray.csproj

      - name: Build
        run: dotnet build OpenOTSTray/OpenOTSTray.csproj -c Release --no-restore

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish OpenOTSTray/OpenOTSTray.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenOTSTray-win-x64
          path: publish/OpenOTSTray.exe
          if-no-files-found: error
